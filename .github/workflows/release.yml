name: Release

# Builds the signed Play Store bundle (.aab) and APK.
# Runs when a version tag like v1.0.0 is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KAIRO_KEYSTORE_BASE64: ${{ secrets.KAIRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KAIRO_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not set. See RELEASING.md."
            exit 1
          fi
          echo "$KAIRO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kairo-upload.jks"

      - name: Test, lint and build signed bundle
        env:
          KAIRO_KEYSTORE_PATH: ${{ runner.temp }}/kairo-upload.jks
          KAIRO_KEYSTORE_PASSWORD: ${{ secrets.KAIRO_KEYSTORE_PASSWORD }}
          KAIRO_KEY_ALIAS: ${{ secrets.KAIRO_KEY_ALIAS }}
          KAIRO_KEY_PASSWORD: ${{ secrets.KAIRO_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest :core:model:test lintRelease bundleRelease assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kairo-upload.jks"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: kairo-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
